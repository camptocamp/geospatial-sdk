name: Publish NPM package @dev version

# This workflow was taken from https://docs.npmjs.com/trusted-publishers#step-2-configure-your-cicd-workflow-1
# Runs whenever a commit is pushed on main

on:
  push:
    branches:
      - main

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish-npm-package:
    name: Publish NPM package
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node & NPM
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # never use caching in release builds

      - name: Install project dependencies
        run: npm ci

      - name: Publish canary version of packages
        run: npx lerna publish --canary --force-publish --dist-tag dev --preid dev --yes
